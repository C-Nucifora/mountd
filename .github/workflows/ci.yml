name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The menu bar client is a bare swiftc build with no Xcode project, so
      # nothing else in CI would ever notice it stopped compiling.
      - name: Typecheck the menu bar app
        run: swiftc -typecheck -swift-version 5 menubar/Sources/main.swift
      - name: Build the menu bar app
        run: ./build.sh
        working-directory: menubar
